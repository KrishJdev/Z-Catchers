name: CI

on:
  push:
    branches:
      - main
      - dev
      - krish
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-test-session-secret-at-least-32-characters-long' }}
          PIN_SALT: ${{ secrets.PIN_SALT || 'ci-test-pin-salt-for-verification' }}
        run: npm run build

      - name: Run automated test suites
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-test-session-secret-at-least-32-characters-long' }}
          PIN_SALT: ${{ secrets.PIN_SALT || 'ci-test-pin-salt-for-verification' }}
        run: npm run test:unit
