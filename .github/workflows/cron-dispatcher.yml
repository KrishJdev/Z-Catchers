name: External Cron Dispatcher (Fallback)

on:
  schedule:
    # Runs every 5 minutes as a fallback cron dispatcher for free-tier deployments (e.g. Vercel Hobby)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Bedtime & Nag Notifications Dispatcher
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${APP_URL:?Set the APP_URL Actions secret to the deployment origin}"
          : "${CRON_SECRET:?Set the CRON_SECRET Actions secret to match the deployment}"
          response=$(curl --fail --silent --show-error --proto '=https' --max-time 120 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/dispatch-notifications")
          jq -e '.success == true and (.details.errors | length == 0)' <<< "$response"
