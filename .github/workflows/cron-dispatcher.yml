name: External Cron Dispatcher (Fallback)

on:
  schedule:
    # Runs every 5 minutes as a fallback cron dispatcher for free-tier deployments (e.g. Vercel Hobby)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Bedtime & Nag Notifications Dispatcher
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not set. Skipping external cron dispatch."
            exit 0
          fi
          echo "Dispatching cron to $APP_URL/api/cron/dispatch-notifications..."
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="-H \"Authorization: Bearer $CRON_SECRET\""
          fi
          eval curl -s -S -X GET "$APP_URL/api/cron/dispatch-notifications" $AUTH_HEADER
